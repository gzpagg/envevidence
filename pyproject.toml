[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "envevidence"
version = "0.4.0"
description = "Local environmental experiment analysis, reproducible kinetics and literature evidence review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "streamlit>=1.64,<2", "pypdf>=6,<7", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "openpyxl>=3.1,<4",
  "numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4,<6", "build>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
envevidence = "envevidence.cli:main"

[tool.setuptools.packages.find]
include = ["envevidence*"]

[tool.setuptools.package-data]
envevidence = ["assets/*.json", "assets/*.pdf", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["data", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
